services:
  postgres:
    image: postgres:17-alpine
    container_name: devalias-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devalias}
      POSTGRES_USER: ${POSTGRES_USER:-devalias}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devalias_local_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - devalias_postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  devalias_postgres_data:
